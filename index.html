<style>
:root{
  --paper:#F6F2EA; --card:#FFFDF8; --ink:#22201C; --muted:#5F594F; --rule:#DDD5C7; --rule2:#EAE3D6; --line:#C9C0B0;
  --faith:#A8761A; --faithT:#8A6214; --body:#B4532A; --bodyT:#A3481F; --plan:#2F4A6D; --home:#3F6B4A; --rest:#6A4C7A; --work:#9C968B;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'Source Sans 3', -apple-system, 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--plan)}
.screen{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 104px);display:flex;flex-direction:column;gap:14px}
.screen.noTabs{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
h1{margin:0;font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15}
h2{margin:0;font-family:var(--serif);font-weight:600;font-size:19px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.card.dark{background:var(--ink);color:var(--card);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.dark{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.navy{background:var(--plan);color:var(--card);border-color:var(--plan)}
.btn.block{width:100%}
.btn.sm{min-height:36px;font-size:13px;padding:0 10px}
.btn.link{border:0;background:none;color:var(--plan);padding:0 4px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:17px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:5px;display:inline-block;flex:none}
.bar{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.list{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:0 14px}
.item{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--rule2)}
.item:last-child{border-bottom:0}
.item .t{width:46px;font-size:12px;color:var(--muted);flex:none}
.item .c{width:4px;height:24px;border-radius:2px;flex:none}
.item .x{flex:1;font-size:16px;line-height:1.3}
.item.done .x{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ink);margin:0;flex:none}
.txt{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:16px;border-radius:0}
.txt.serif{font-family:var(--serif)}
.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:16px}
textarea.txt{resize:vertical;min-height:90px;line-height:1.5}
.seg{display:flex;background:var(--rule2);border-radius:8px;padding:3px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:6px;color:var(--muted);font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal{height:44px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink)}
.chg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.chg button{height:40px;border-radius:5px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer}
.chg button.r{background:var(--faithT);border-color:var(--faithT);color:var(--card);font-weight:600}
.chg button.n{border:2px solid var(--ink);font-weight:600}
.step{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1px solid var(--rule2)}
.step:last-child{border-bottom:0}
.step .num{width:34px;text-align:center;font-weight:600;font-size:17px}
.step button{width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:20px;cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);background:none;border:0;min-width:60px;min-height:50px;justify-content:center;cursor:pointer}
.tabbar button.on{color:var(--ink);font-weight:600}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.32em}
.empty{padding:16px 0;color:var(--muted);font-size:14px}
.ent{display:flex;gap:12px;align-items:baseline;min-height:44px;border-bottom:1px solid var(--rule2);font-size:15px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;padding:0}

.reader{font-family:var(--serif);font-size:var(--rs,19px);line-height:1.65}
.reader p{margin:0 0 14px;white-space:pre-line}
.reader sup{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--faithT);margin-right:3px;vertical-align:4px}
.votd{font-family:var(--serif);font-size:17px;line-height:1.5}
.tl{background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tl-row{display:flex;border-top:1px solid var(--rule2);min-height:46px}
.tl-row:first-child{border-top:0}
.tl-row.work{background:#F1ECE2}
.tl-row.over{background:#E3ECF6;outline:2px dashed var(--plan);outline-offset:-2px}
.tl-h{width:54px;flex:none;font-size:12px;color:var(--muted);padding:6px 0 0 10px}
.tl-s{flex:1;min-width:0;padding:4px 6px 4px 0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.ti{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;min-height:40px}
.tl-row.work .ti{background:#FFFDF8}
.ti .c{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ti .x{flex:1;min-width:0;font-size:15px;line-height:1.25}
.ti .tm{font-size:11px;color:var(--muted);flex:none}
.ti.done .x{text-decoration:line-through;color:var(--muted)}
.ti.blk .x{color:var(--muted)}
.handle{width:28px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--muted);touch-action:none;cursor:grab}
.mini{min-height:34px;padding:0 7px;white-space:nowrap;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;flex:none}
.ti input.et{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px;padding:4px 0}
.ti input.tt{width:108px;flex:none;flex:none;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:13px;background:var(--card)}
.ghost{position:fixed;z-index:20;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:rotate(-1deg)}
.plus{border:0;background:none;color:var(--muted);font-size:13px;text-align:left;padding:6px 0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9}
svg text{font-family:var(--sans)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
'use strict';
/* ---------- Data ---------- */
var BOOKS = [
['Genesis',50,'GEN'],['Exodus',40,'EXO'],['Leviticus',27,'LEV'],['Numbers',36,'NUM'],['Deuteronomy',34,'DEU'],['Joshua',24,'JOS'],['Judges',21,'JDG'],['Ruth',4,'RUT'],['1 Samuel',31,'1SA'],['2 Samuel',24,'2SA'],['1 Kings',22,'1KI'],['2 Kings',25,'2KI'],['1 Chronicles',29,'1CH'],['2 Chronicles',36,'2CH'],['Ezra',10,'EZR'],['Nehemiah',13,'NEH'],['Esther',10,'EST'],['Job',42,'JOB'],['Psalms',150,'PSA'],['Proverbs',31,'PRO'],['Ecclesiastes',12,'ECC'],['Song of Songs',8,'SNG'],['Isaiah',66,'ISA'],['Jeremiah',52,'JER'],['Lamentations',5,'LAM'],['Ezekiel',48,'EZK'],['Daniel',12,'DAN'],['Hosea',14,'HOS'],['Joel',3,'JOL'],['Amos',9,'AMO'],['Obadiah',1,'OBA'],['Jonah',4,'JON'],['Micah',7,'MIC'],['Nahum',3,'NAM'],['Habakkuk',3,'HAB'],['Zephaniah',3,'ZEP'],['Haggai',2,'HAG'],['Zechariah',14,'ZEC'],['Malachi',4,'MAL'],
['Matthew',28,'MAT'],['Mark',16,'MRK'],['Luke',24,'LUK'],['John',21,'JHN'],['Acts',28,'ACT'],['Romans',16,'ROM'],['1 Corinthians',16,'1CO'],['2 Corinthians',13,'2CO'],['Galatians',6,'GAL'],['Ephesians',6,'EPH'],['Philippians',4,'PHP'],['Colossians',4,'COL'],['1 Thessalonians',5,'1TH'],['2 Thessalonians',3,'2TH'],['1 Timothy',6,'1TI'],['2 Timothy',4,'2TI'],['Titus',3,'TIT'],['Philemon',1,'PHM'],['Hebrews',13,'HEB'],['James',5,'JAS'],['1 Peter',5,'1PE'],['2 Peter',3,'2PE'],['1 John',5,'1JN'],['2 John',1,'2JN'],['3 John',1,'3JN'],['Jude',1,'JUD'],['Revelation',22,'REV']
];
var OT_COUNT = 39, TOTAL_CH = 1189;
var DINNERS = [
{n:'Tinola',d:'Chicken, sayote, ginger, malunggay',t:40,k:'weekend'},
{n:'Sinigang na isda',d:'Fish, tamarind broth, kangkong, radish',t:35,k:'weekend'},
{n:'Ginisang monggo',d:'Mung beans, spinach or malunggay, a little pork or fish',t:45,k:'weekend'},
{n:'Pinakbet',d:'Squash, okra, eggplant, string beans',t:40,k:'weekend'},
{n:'Nilagang baka',d:'Beef, potato, cabbage, corn in clear broth',t:90,k:'weekend'},
{n:'Arroz caldo',d:'Rice porridge with chicken and ginger',t:50,k:'weekend'},
{n:'Steamed fish with ginger',d:'Tilapia or bangus, ginger, scallions',t:25,k:'quick'},
{n:'Chicken and vegetable stir-fry',d:'Chicken breast, broccoli, carrots, bell pepper',t:20,k:'quick'},
{n:'Chopsuey',d:'Mixed vegetables with chicken or shrimp',t:25,k:'quick'},
{n:'Ginisang ampalaya with egg',d:'Bitter gourd, tomato, egg',t:20,k:'quick'},
{n:'Laswa',d:'Light vegetable soup with squash and okra',t:25,k:'quick'},
{n:'Grilled chicken, rice and salad',d:'Lean chicken, cucumber tomato salad',t:30,k:'quick'}
];
var BASE_WORKOUTS = {rest:'Rest',walk:'Walk',strength:'Strength',core:'Core',cardio:'Cardio',gym:'Gym'};
function allW(){var o={};for(var k in BASE_WORKOUTS)if((S.hiddenW||[]).indexOf(k)<0||k==='rest')o[k]=BASE_WORKOUTS[k];(S.customW||[]).forEach(function(c){o[c.id]=c.name});return o}
function wName(k){return allW()[k]||BASE_WORKOUTS[k]||((S.customW||[]).filter(function(c){return c.id===k})[0]||{}).name||'Workout'}
var CATS=[['faith','Faith'],['body','Body'],['work','Work'],['home','Home'],['rest','Rest']];
var CAT = {faith:'var(--faith)',body:'var(--body)',work:'var(--work)',plan:'var(--plan)',home:'var(--home)',rest:'var(--rest)'};
var DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- Dates ---------- */
function pad(n){return (n<10?'0':'')+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function todayKey(){return keyOf(new Date())}
function weekStart(k){var d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function shortDate(k){var d=parseKey(k);return MON[d.getMonth()].slice(0,3)+' '+d.getDate()}
function longDate(k){var d=parseKey(k);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()}
function t12(hm,short){if(!hm)return'';var p=hm.split(':'),h=+p[0],m=p[1];var ap=h>=12?'PM':'AM';h=h%12||12;return short?(h+':'+m):(h+':'+m+' '+ap)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}

/* ---------- State ---------- */
var STORE='mondo.v1';
function defaults(){return {v:1,setup:false,
 settings:{wake:'06:45',bible:'07:00',workStart:'08:00',workEnd:'17:00',gym:'17:30',dinner:'18:30',plan:'21:00',bed:'22:00',bibleVersion:'111',plan7:['rest','walk','strength','walk','strength','walk','gym']},
 days:{},weeks:{},bible:{read:{},current:0},weights:[],doctor:{booked:false,done:false},favorites:[],lastBackup:null,customW:[],hiddenW:[],routines:[]}}
function merge(base,src){for(var k in src){if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))merge(base[k],src[k]);else base[k]=src[k]}return base}
var S;
try{S=merge(defaults(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){S=defaults()}
var FIRST_DAY='2026-11-12';
function startDate(){return S.settings.startDate||FIRST_DAY}
function freshStart(from){var keep={};for(var k in S.days)if(k>=from)keep[k]=S.days[k];S.days=keep;
 for(var r in S.bible.read)if(S.bible.read[r]<from)delete S.bible.read[r];
 S.weights=S.weights.filter(function(w){return w.date>=from});
 var wk={};for(var w in S.weeks)if(w>=weekStart(from))wk[w]=S.weeks[w];S.weeks=wk;
 if(!Object.keys(S.bible.read).length)S.bible.current=0;S.settings.startDate=from}
function applyFresh(){if(S.freshV!==1){var t=keyOf(new Date());freshStart(t<=FIRST_DAY?FIRST_DAY:t);S.freshV=1;return true}return false}
var storageOK=true;
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}cloudPush()}
/* ---------- Cloud sync (Claude account) ---------- */
var cloud={col:null,ready:false,status:'local',synced:{},queue:Promise.resolve(),timer:null,dl:null};
function splitState(){var core={},months={};for(var k in S)if(k!=='days')core[k]=S[k];for(var d in S.days){var m='m-'+d.slice(0,7);(months[m]=months[m]||{})[d]=S.days[d]}return{core:core,months:months}}
function cloudPush(){if(!cloud.ready)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(function(){var sp=splitState(),jobs=[],cs=JSON.stringify(sp.core);
 if(cloud.synced.core!==cs)jobs.push(['core',{state:cs},cs]);
 for(var m in sp.months){var ms=JSON.stringify(sp.months[m]);if(cloud.synced[m]!==ms)jobs.push([m,{days:ms},ms])}
 jobs.forEach(function(j){cloud.queue=cloud.queue.then(function(){return cloud.col.doc(j[0]).set(j[1])}).then(function(){cloud.synced[j[0]]=j[2];setCloud('ok')}).catch(function(e){setCloud(e&&e.code==='quota_exceeded'?'full':'error')})})},800)}
function setCloud(st){if(cloud.status===st)return;cloud.status=st;if(route.name==='settings')render(true)}
function cloudText(){return {ok:'Saved to your Claude account. Open MONDO on any device signed in to Claude and your progress is there.',loading:'Loading your data...',local:'Saved on this device only.',error:'Could not reach your Claude account. Changes are saved on this device and will sync when it reconnects.',full:'Your Claude storage for MONDO is full. Back up, then contact support.'}[cloud.status]}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function migrateWeeks(){if(S.weekMon)return false;var nw={};for(var w in S.weeks){var d=parseKey(w),k=d.getDay()===0?addDays(w,1):w;if(!nw[k])nw[k]=S.weeks[w]}S.weeks=nw;S.weekMon=1;return true}
function migrateBible(){var tk=keyOf(new Date()),ch=false;for(var k in S.days){if(k<tk)continue;S.days[k].items.forEach(function(i){if(i.kind==='bible'&&i.chapters&&!i.done){i.text='Bible reading';delete i.chapters;ch=true}})}return ch}
if(applyFresh()|migrateBible()|migrateWeeks()){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}

var route={name:S.setup?'today':'setup'};
var ui={calMonth:null,bibleT:1,book:null,dinnerKind:'quick',dinnerIdx:0,q:'',draft:null,eraseArm:false};

/* ---------- Bible ---------- */
function bkey(code,ch){return code+'.'+ch}
function isRead(code,ch){return !!S.bible.read[bkey(code,ch)]}
function bookIndex(code){for(var i=0;i<BOOKS.length;i++)if(BOOKS[i][2]===code)return i;return -1}
function bookRead(i){var b=BOOKS[i],n=0;for(var c=1;c<=b[1];c++)if(isRead(b[2],c))n++;return n}
function readCount(from,to){var n=0;for(var i=from;i<to;i++)n+=bookRead(i);return n}
function nextChapters(n,exclude){exclude=exclude||{};var out=[],i=S.bible.current||0,guard=0;
 while(out.length<n&&guard<BOOKS.length+1){var b=BOOKS[i];for(var c=1;c<=b[1]&&out.length<n;c++){var k=bkey(b[2],c);if(!S.bible.read[k]&&!exclude[k])out.push([b[2],c])}
  if(out.length<n){i=(i+1)%BOOKS.length;guard++}}
 return out}
function chText(chs){if(!chs||!chs.length)return'Bible reading';var parts=[],i=0;
 while(i<chs.length){var code=chs[i][0],start=chs[i][1],end=start;var j=i+1;while(j<chs.length&&chs[j][0]===code&&chs[j][1]===end+1){end++;j++}
  var name=BOOKS[bookIndex(code)][0];parts.push(name+' '+(start===end?start:start+' to '+end));i=j}
 return parts.join(', ')}
function bibleLink(chs){if(!chs||!chs.length)return'#';return'https://www.bible.com/bible/'+encodeURIComponent(S.settings.bibleVersion||'111')+'/'+chs[0][0]+'.'+chs[0][1]}
function setRead(code,ch,on,dateKey){var k=bkey(code,ch);if(on){S.bible.read[k]=dateKey||todayKey();var i=bookIndex(code);if(bookRead(i)<BOOKS[i][1])S.bible.current=i;else S.bible.current=(i+1)%BOOKS.length}else delete S.bible.read[k]}
var BIBLE={};

 rsize:function(el){S.settings.readSize=Math.max(15,Math.min(26,(S.settings.readSize||19)+2*(+el.dataset.d)));save();render(true)},
 bt:function(el){ui.bibleT=+el.dataset.t;render(true)},
 book:function(el){ui.book=+el.dataset.i;render(false)},
 logW:function(el){var tk=todayKey(),d=getDay(tk,true),m=+document.getElementById('mins').value||0,w=el.dataset.w,nt=document.getElementById('wnotes');d.workout={type:w,min:m,notes:nt?nt.value:''};ui.wnotes='';var g=d.items.filter(function(i){return i.kind==='gym'})[0];if(g)g.done=true;else d.items.push(mk('gym','body',wName(w),S.settings.gym,{done:true,workoutType:w}));d.rest=false;save();render(true);toast(wName(w)+' logged')},
 unlog:function(){var d=S.days[todayKey()];if(d){delete d.workout;d.items.forEach(function(i){if(i.kind==='gym')i.done=false})}save();render(true)},
 saveW:function(){var v=parseFloat(document.getElementById('wt').value);if(!(v>50&&v<700)){toast('Enter your weight in pounds');return}var tk=todayKey();S.weights=S.weights.filter(function(w){return w.date!==tk});S.weights.push({date:tk,lb:Math.round(v*10)/10});S.weights.sort(function(a,b){return a.date.localeCompare(b.date)});save();render(true);toast('Weight saved')},
 dk:function(el){ui.dinnerKind=el.dataset.k;ui.dinnerIdx=0;render(true)},
 dnext:function(){ui.dinnerIdx++;render(true)},
 dfav:function(el){var n=el.dataset.n,i=S.favorites.indexOf(n);if(i<0)S.favorites.push(n);else S.favorites.splice(i,1);save();render(true)},
 dunfav:function(el){S.favorites.splice(+el.dataset.i,1);save();render(true)},
 duse:function(el){var d=getDay(todayKey(),true),n=el.dataset.n,it=d.items.filter(function(i){return i.kind==='dinner'})[0];if(it)it.text='Dinner: '+n;else d.items.push(mk('dinner','home','Dinner: '+n,S.settings.dinner,{}));save();toast('Tonight: '+n);go('today')},
 dtom:function(el){var n=el.dataset.n,it=ui.draft.day.items.filter(function(i){return i.kind==='dinner'})[0];if(it)it.text='Dinner: '+n;route={name:'plan'};render(false);toast('Tomorrow: '+n)},
 export:function(){var data=JSON.stringify(S,null,1),name='mondo-backup-'+todayKey()+'.json';var done=function(){S.lastBackup=Date.now();save();render(true);toast('Backup saved')};
  if(cloud.dl){cloud.dl.save({filename:name,data:data}).then(done).catch(function(){toast('Backup not saved')});return}
  try{var file=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'MONDO backup'}).then(done).catch(function(){});return}}catch(e){}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);done()},
 import:function(){document.getElementById('importFile').click()},
 addW:function(){var inp=document.getElementById('newW'),v=inp.value.trim();if(!v)return;S.customW=S.customW||[];S.customW.push({id:'c_'+uid(),name:v});save();render(true);toast(v+' added')},
 rmW:function(el){S.customW=(S.customW||[]).filter(function(c){return c.id!==el.dataset.w});S.settings.plan7=S.settings.plan7.map(function(w){return w===el.dataset.w?'rest':w});save();render(true)},
 hideW:function(el){var w=el.dataset.w;S.hiddenW=S.hiddenW||[];var i=S.hiddenW.indexOf(w);if(i<0){S.hiddenW.push(w);S.settings.plan7=S.settings.plan7.map(function(x){return x===w?'rest':x})}else S.hiddenW.splice(i,1);save();render(true)},
 rDay:function(el){ui.rDays=ui.rDays||[];var i=+el.dataset.i,j=ui.rDays.indexOf(i);if(j<0)ui.rDays.push(i);else ui.rDays.splice(j,1);var keep={t:document.getElementById('rText').value,c:document.getElementById('rCat').value,m:document.getElementById('rTime').value};render(true);document.getElementById('rText').value=keep.t;document.getElementById('rCat').value=keep.c;document.getElementById('rTime').value=keep.m},
 addR:function(){var t=document.getElementById('rText').value.trim();if(!t){toast('Name the activity');return}if(!ui.rDays||!ui.rDays.length){toast('Pick at least one day');return}S.routines=S.routines||[];S.routines.push({id:uid(),text:t,cat:document.getElementById('rCat').value,time:document.getElementById('rTime').value,days:ui.rDays.slice().sort()});ui.rDays=[];
  var tk=todayKey();for(var i=0;i<14;i++){var k=addDays(tk,i),d=S.days[k],r=S.routines[S.routines.length-1];if(d&&!d.planned&&k>tk&&r.days.indexOf(parseKey(k).getDay())>=0)d.items.push(mk('routine',r.cat,r.text,r.time,{rid:r.id}))}
  save();render(true);toast(t+' added')},
 rmR:function(el){S.routines=(S.routines||[]).filter(function(r){return r.id!==el.dataset.id});save();render(true)},
 fresh:function(){var v=document.getElementById('sd').value;if(!v)return;if(!ui.freshArm){ui.freshArm=true;render(true);document.getElementById('sd').value=v;return}ui.freshArm=false;freshStart(v);save();go('today');toast('Fresh start: '+longDate(v))},
 erase:function(){if(!ui.eraseArm){ui.eraseArm=true;render(true);return}S=defaults();save();ui.eraseArm=false;go('setup')}
};

document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var f=A[el.dataset.a];if(f){if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();f(el,e)}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.toggle){var p=t.dataset.toggle.split('|'),k=p[0],it=findItem(k,p[1]);if(!it)return;it.done=t.checked;
  if(it.kind==='bible'&&it.chapters)it.chapters.forEach(function(c){setRead(c[0],c[1],it.done,k)});
  save();render(true);return}
 if(t.dataset.settime){var q=t.dataset.settime.split('|'),ii=findItem(q[0],q[1]);if(ii){ii.time=t.value;save();render(true)}return}
 if(t.dataset.inc){var di=ui.draft.day.items.filter(function(i){return i.id===t.dataset.inc})[0];if(di)di.inc=t.checked;return}
 if(t.dataset.swapw){var gi=ui.draft.day.items.filter(function(i){return i.id===t.dataset.swapw})[0];if(gi){gi.workoutType=t.value;gi.text=wName(t.value)}return}
 if(t.dataset.doc){S.doctor[t.dataset.doc]=t.checked;if(t.dataset.doc==='done'&&t.checked)S.doctor.booked=true;save();render(true);return}
 if(t.dataset.plan7){S.settings.plan7[+t.dataset.plan7]=t.value;save();return}
 if(t.dataset.path&&t.type==='time'){setPath(t.dataset.path,t.value);return}
 if(t.id==='importFile'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||d.v!==1||!d.days)throw 0;S=merge(defaults(),d);S.setup=true;save();go('today');toast('Data restored')}catch(err){toast('That file is not a MONDO backup')}t.value=''};r.readAsText(t.files[0])}
});
document.addEventListener('input',function(e){var t=e.target;
 if(t.dataset.path&&t.type!=='time'){setPath(t.dataset.path,t.value);return}
 if(t.id==='wnotes'){ui.wnotes=t.value;return}
 if(t.dataset.edit){var q2=t.dataset.edit.split('|'),i2=findItem(q2[0],q2[1]);if(i2){i2.text=t.value;save()}return}
 if(t.dataset.draft&&ui.draft){ui.draft.day[t.dataset.draft]=t.value;return}
 if(t.hasAttribute('data-search')){ui.q=t.value;var k=route.k||todayKey(),q=ui.q.toLowerCase();
  var ent=Object.keys(S.days).filter(function(x){var jj=S.days[x].journal||{};return x!==k&&(jj.grateful||jj.well||jj.better||jj.bible||jj.free)}).sort().reverse().filter(function(x){if(!q)return true;var jj=S.days[x].journal;return [jj.grateful,jj.well,jj.better,jj.bible,jj.free,S.days[x].intention].join(' ').toLowerCase().indexOf(q)>=0});
  document.getElementById('entries').innerHTML=entriesHtml(ent)}
});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(t.id==='addItem')A.addItem({dataset:{k:todayKey()}});if(t.id==='mustDo')A.addMust()});
var drag=null;
document.addEventListener('pointerdown',function(e){var hd=e.target.closest('[data-drag]');if(!hd)return;e.preventDefault();var p=hd.dataset.drag.split('|'),row=hd.closest('.ti'),r=row.getBoundingClientRect();
 var g=row.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';document.body.appendChild(g);row.style.opacity='.35';
 drag={k:p[0],id:p[1],g:g,dx:e.clientX-r.left,dy:e.clientY-r.top,over:null,row:row};try{hd.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',function(e){if(!drag)return;e.preventDefault();drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px';
 var el=document.elementFromPoint(e.clientX,e.clientY),slot=el&&el.closest('[data-slot]');if(drag.over&&drag.over!==slot)drag.over.classList.remove('over');if(slot){slot.classList.add('over');drag.over=slot}else drag.over=null;
 var H=window.innerHeight;if(e.clientY<80)window.scrollBy(0,-14);else if(e.clientY>H-110)window.scrollBy(0,14)},{passive:false});
function endDrag(){if(!drag)return;var d=drag;drag=null;d.g.remove();d.row.style.opacity='';if(!d.over)return;d.over.classList.remove('over');var it=findItem(d.k,d.id);if(!it)return;var sl=d.over.dataset.slot;
 if(sl==='none')it.time='';else{var hh=+sl,old=it.time?+it.time.split(':')[0]:-1;it.time=pad(hh)+':'+(old===hh?it.time.split(':')[1]:'00')}save();render(true);toast(sl==='none'?'Moved to any time':'Moved to '+hourLabel(+sl))}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
var lastDay=todayKey();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&todayKey()!==lastDay){lastDay=todayKey();if(route.name==='today')render(false)}});

render(false);
(async function(){if(!(window.claude&&claude.use))return;
 try{var dl=await claude.use('downloads');cloud.dl=dl}catch(e){}
 try{var db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;var uid=await user.id();if(!uid)return;
  cloud.col=db.collection('data/users/'+uid);setCloud('loading');var to=setTimeout(function(){setCloud('error')},10000);
  var snap=await cloud.col.get();clearTimeout(to);var core=null,days={};
  snap.docs.forEach(function(d){var x=d.data()||{};if(d.id==='core'&&x.state){core=JSON.parse(x.state);cloud.synced.core=x.state}else if(d.id.indexOf('m-')===0&&x.days){cloud.synced[d.id]=x.days;var dd=JSON.parse(x.days);for(var k in dd)days[k]=dd[k]}});
  if(core){S=merge(defaults(),core);S.days=days;applyFresh();migrateBible();migrateWeeks();try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}if(S.setup&&route.name==='setup')route={name:'today'}}
  cloud.ready=true;setCloud('ok');cloudPush();render(true)
 }catch(e){setCloud('error')}})();
</script>
